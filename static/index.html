<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/index.css">
  <link rel="stylesheet" href="/static/css/member.css">
  <title>台北一日遊</title>
</head>
<body>
  <nav>
    <div class="navigation">

      <div class="logo">
        <a href="/">台北一日遊</a>
      </div>

      <div class="nav-menu">
        <div class="nav-item">預定行程</div>
        <div class="nav-item" id="login-register-button">登入/註冊</div>
      </div>

    </div>
  </nav>

  <!-- 會員登入 / 註冊視窗 -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="member-dialog" id="signin-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="dialog-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">登入會員帳號</h2>

        <div class="dialog-form">
          <input
            type="email"
            id="signin-email"
            class="dialog-input"
            placeholder="輸入電子信箱"
          >

          <input
            type="password"
            id="signin-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signin-button"
          >
            登入帳戶
          </button>
        </div>

        <!-- 登入錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signin-message"></div>

        <div class="dialog-switch">
          還沒有帳戶？<span id="show-signup">點此註冊</span>
        </div>
      </div>
    </div>

    <div class="member-dialog" id="signup-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="signup-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">註冊會員帳號</h2>

        <div class="dialog-form">
          <input
            type="text"
            id="signup-name"
            class="dialog-input"
            placeholder="輸入姓名"
          >

          <input
            type="email"
            id="signup-email"
            class="dialog-input"
            placeholder="輸入電子郵件"
          >

          <input
            type="password"
            id="signup-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signup-button"
          >
            註冊新帳戶
          </button>
        </div>

        <!-- 註冊錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signup-message"></div>

        <div class="dialog-switch">
          已經有帳戶了？<span id="show-signin">點此登入</span>
        </div>
      </div>
    </div>
  </div>

  <main>
    <section class="hero">
      <div class="hero-content">

        <div class="hero-text">
          <h1>輕鬆享受台北一日悠閒</h1>
          <p>探索每個角落，體驗城市的深度旅遊行程</p>
        </div>

        <div class="search-bar">

          <div class="category-selector">
            全部分類▼
          </div>
          
          <div class="category-panel">
            <!-- JavaScript 動態加入分類名稱 -->
          </div>


          <input
            class="search-input"
            type="text"
            placeholder="輸入景點名稱查詢"
          >

          <button class="search-button">
            <img src="/static/images/icon_search image.png" alt="搜尋">
          </button>

        </div>

      </div>
    </section>

    <section class="attraction-section">
      <div class="list-bar">

        <button class="arrow-button left">
          <img src="/static/images/left image.png" alt="向左">
        </button>

        <!-- JavaScript 之後會把 MRT 名稱放進來 -->
        <div class="mrt-list">
          <div class="mrt-list-container">
            <!-- JavaScript 動態加入 mrt-item -->
          </div>
        </div>

        <button class="arrow-button right">
          <img src="/static/images/right image.png" alt="向右">
        </button>

      </div>

      <!-- JavaScript 之後會把景點卡片放進來 -->
      <div class="attraction-list">
        <div class="attractions-group">
          <!-- JavaScript 動態加入 attraction -->
        </div>
      </div>

      <!-- 用來偵測使用者是否滑到景點列表底部 -->
      <div class="observer"></div>

    </section>
  </main>

  <footer>
    <div class="footer-content">
      COPYRIGHT © 2021 台北一日遊
    </div>
  </footer>

  <script src="/static/js/index.js"></script>
  <script src="/static/js/member.js"></script>

</body>
</html>
