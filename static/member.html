<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/member.css">
  <link rel="stylesheet" href="/static/css/memberpage.css">
  <title>台北一日遊</title>
</head>
<body>
  <nav>
    <div class="navigation">

      <div class="logo">
        <a href="/">台北一日遊</a>
      </div>

      <div class="nav-menu">
        <div class="nav-item" id="booking-button">預定行程</div>
        <div class="nav-item" id="login-register-button">登入/註冊</div>
      </div>

    </div>
  </nav>

  <!-- 會員登入 / 註冊視窗 -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="member-dialog" id="signin-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="dialog-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">登入會員帳號</h2>

        <div class="dialog-form">
          <input
            type="email"
            id="signin-email"
            class="dialog-input"
            placeholder="輸入電子信箱"
          >

          <input
            type="password"
            id="signin-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signin-button"
          >
            登入帳戶
          </button>
        </div>

        <!-- 登入錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signin-message"></div>

        <div class="dialog-switch">
          還沒有帳戶？<span id="show-signup">點此註冊</span>
        </div>
      </div>
    </div>

    <div class="member-dialog" id="signup-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="signup-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">註冊會員帳號</h2>

        <div class="dialog-form">
          <input
            type="text"
            id="signup-name"
            class="dialog-input"
            placeholder="輸入姓名"
          >

          <input
            type="email"
            id="signup-email"
            class="dialog-input"
            placeholder="輸入電子郵件"
          >

          <input
            type="password"
            id="signup-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signup-button"
          >
            註冊新帳戶
          </button>
        </div>

        <!-- 註冊錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signup-message"></div>

        <div class="dialog-switch">
          已經有帳戶了？<span id="show-signin">點此登入</span>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div class="member-container">

      <!-- 會員歡迎文字 -->
      <section class="member-welcome">
        <h2>
          您好，<span id="member-name"></span>：
        </h2>
      </section>

      <hr>

      <!-- AI 工具整合 -->
      <section class="mcp-section">
        <h2>AI 工具整合</h2>

        <div class="mcp-content">
          <p>MCP 伺服器設定：</p>

          <ul>
            <li>
              <div>Host URL</div>
              <div id="mcp-host-url">http://127.0.0.1:8000/mcp/</div>
            </li>

            <li>
              <div>Bearer Token</div>
              <div id="bearer-token"></div>
            </li>
          </ul>

          <button type="button" id="generate-token-button">
            產生 / 更新金鑰
          </button>
        </div>
      </section>

      <hr>

      <!-- 登出 -->
      <section class="logout-section">
        <button type="button" id="logout-button">
          登出會員
        </button>
      </section>

    </div>
  </main>
  
  <footer>
    <div class="footer-content">
      COPYRIGHT © 2021 台北一日遊
    </div>
  </footer>

  <script src="/static/js/member.js"></script>
  <script src="/static/js/memberpage.js"></script>

</body>
</html>
