<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/thankyou.css">
  <link rel="stylesheet" href="/static/css/member.css">
  <title>台北一日遊</title>
</head>
<body>
  <nav>
    <div class="navigation">

      <div class="logo">
        <a href="/">台北一日遊</a>
      </div>

      <div class="nav-menu">
        <div class="nav-item" id="booking-button">預定行程</div>
        <div class="nav-item" id="login-register-button">登入/註冊</div>
      </div>

    </div>
  </nav>

  <!-- 會員登入 / 註冊視窗 -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="member-dialog" id="signin-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="dialog-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">登入會員帳號</h2>

        <div class="dialog-form">
          <input
            type="email"
            id="signin-email"
            class="dialog-input"
            placeholder="輸入電子信箱"
          >

          <input
            type="password"
            id="signin-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signin-button"
          >
            登入帳戶
          </button>
        </div>

        <!-- 登入錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signin-message"></div>

        <div class="dialog-switch">
          還沒有帳戶？<span id="show-signup">點此註冊</span>
        </div>
      </div>
    </div>

    <div class="member-dialog" id="signup-dialog">
      <!-- Dialog 上方裝飾色條 -->
      <div class="dialog-decorator"></div>

      <button class="dialog-close" id="signup-close">
        <img src="/static/images/close.png" alt="關閉">
      </button>

      <div class="dialog-main">
        <h2 class="dialog-title">註冊會員帳號</h2>

        <div class="dialog-form">
          <input
            type="text"
            id="signup-name"
            class="dialog-input"
            placeholder="輸入姓名"
          >

          <input
            type="email"
            id="signup-email"
            class="dialog-input"
            placeholder="輸入電子郵件"
          >

          <input
            type="password"
            id="signup-password"
            class="dialog-input"
            placeholder="輸入密碼"
          >

          <button
            type="button"
            class="dialog-button"
            id="signup-button"
          >
            註冊新帳戶
          </button>
        </div>

        <!-- 註冊錯誤訊息之後會由 JavaScript 放進來 -->
        <div class="dialog-message" id="signup-message"></div>

        <div class="dialog-switch">
          已經有帳戶了？<span id="show-signin">點此登入</span>
        </div>
      </div>
    </div>
  </div>

  <main>
    <section class="thankyou-section">

      <div class="thankyou-title">
        行程預定成功
      </div>

      <div class="thankyou-message">
        您的訂單編號如下：
      </div>

      <div
        class="thankyou-number"
        id="thankyou-order-number"
      ></div>

      <div class="thankyou-notice">
        請記住此編號，期待與您一起探索台北！
      </div>

    </section>
  </main>
  
  <footer>
    <div class="footer-content">
      COPYRIGHT © 2021 台北一日遊
    </div>
  </footer>

  <script src="/static/js/thankyou.js"></script>
  <script src="/static/js/member.js"></script>

</body>
</html>
